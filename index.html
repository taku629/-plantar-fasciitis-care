<!DOCTYPE html>

  </button>
</header>

<main id="main">
  <section id="tab-home" class="tab-panel"></section>
  <section id="tab-exercise" class="tab-panel hidden"></section>
  <section id="tab-log" class="tab-panel hidden"></section>
  <section id="tab-chart" class="tab-panel hidden"></section>
  <section id="tab-report" class="tab-panel hidden"></section>
  <section id="tab-settings" class="tab-panel hidden"></section>
</main>

<div id="timerOverlay" class="overlay hidden">
  <div class="timer-card">
    <h2 id="timerName"></h2>
    <div id="timerDisplay" class="timer-display">30</div>
    <div id="timerPhase" class="timer-phase"></div>
    <div class="timer-btns">
      <button id="timerStartPause" class="btn btn-primary">開始</button>
      <button id="timerSkip" class="btn">スキップ</button>
    </div>
    <button id="timerClose" class="btn btn-text">閉じる</button>
  </div>
</div>

<nav class="bottom-nav">
  <button class="nav-btn active" data-tab="home">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span>ホーム</span>
  </button>
  <button class="nav-btn" data-tab="exercise">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="4" r="2"/><path d="M14 7 L12 14"/><path d="M13.5 8 L19.5 9.5"/><path d="M13 8.5 L8.5 11"/><path d="M12 14 L7 20"/><path d="M12 14 L14.5 16.5 L15 20"/></svg>

    <span>記録</span>
  </button>
  <button class="nav-btn" data-tab="chart">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>
    <span>グラフ</span>

  <button class="nav-btn" data-tab="report">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>

  </button>
</nav>

<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>

</html>
